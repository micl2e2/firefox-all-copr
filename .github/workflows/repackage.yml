name: Repackage on version bump

on:
  schedule:
    # 00:00:00 UTC every day. GitHub may start the job a few minutes late.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repackage:
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    steps:
      - name: Install host tools
        run: dnf install -y sudo git dnf-plugins-core

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Trust the workspace
        working-directory: /tmp
        run: git config --system --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Update version files
        run: bash try_update_version.bash

      - name: Commit version bumps
        id: versions
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"
        run: |
          set -eu
          cd "${GITHUB_WORKSPACE}"
          git rev-parse --is-inside-work-tree

          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -eq 0 ]
          then
            echo "No version changes."
            echo "packages_outdated=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          printf 'Changed files:\n'
          printf '  %s\n' "${changed[@]}"

          pkgs=()
          files=()
          for file in "${changed[@]}"
          do
            case "${file}" in
              firefox-esr.version) pkgs+=(firefox-esr) ;;
              firefox-devedition.version) pkgs+=(firefox-devedition) ;;
              firefox-nightly.version) pkgs+=(firefox-nightly) ;;
              *) continue ;;
            esac
            files+=("${file}")
          done
          if [ "${#pkgs[@]}" -eq 0 ]
          then
            echo "No edition version files changed."
            echo "packages_outdated=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "Bump Firefox edition versions."
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "packages_outdated=${pkgs[*]}" >> "${GITHUB_OUTPUT}"

      - name: Trigger Copr builds
        if: steps.versions.outputs.packages_outdated != ''
        run: |
          set -eu
          if [ -z "${COPR_WEBHOOK_SECRET}" ]
          then
            echo "Set the COPR_WEBHOOK_SECRET repository secret to the Copr webhook UUID."
            exit 1
          fi
          for pkg in ${COPR_PACKAGES}
          do
            echo "Triggering ${pkg}"
            code="$(curl --silent --output /tmp/copr-body --write-out '%{http_code}' --request POST \
              "https://copr.fedorainfracloud.org/webhooks/custom/260936/${COPR_WEBHOOK_SECRET}/${pkg}/")"
            echo "Copr responded ${code} for ${pkg}"
            if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]
            then
              exit 1
            fi
          done
        env:
          COPR_WEBHOOK_SECRET: ${{ secrets.COPR_WEBHOOK_SECRET }}
          COPR_PACKAGES: ${{ steps.versions.outputs.packages_outdated }}
